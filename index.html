<div class="toast" id="toast">已复制</div>
<script>
  function toast(msg){
    var t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(window.__tt); window.__tt = setTimeout(function(){ t.classList.remove('show'); }, 1600);
  }
  function copyLink(){
    var url = location.origin + location.pathname;
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(url).then(function(){ toast('链接已复制'); }, function(){ legacyCopy(url); });
    } else legacyCopy(url);
  }
  function legacyCopy(url){
    var i = document.createElement('input'); i.value = url; document.body.appendChild(i);
    i.select(); try{ document.execCommand('copy'); toast('链接已复制'); }catch(e){ toast(url); }
    document.body.removeChild(i);
  }
</script>
